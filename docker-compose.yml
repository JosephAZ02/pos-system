services:

  mysql:
    image: mysql:8.4.13
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pos-system}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin123}
      MYSQL_USER: ${DB_ADMIN_USER:-admin}
      MYSQL_PASSWORD: ${DB_ADMIN_PASSWORD:-admin123}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin123}" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - pos-network


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-pos-system}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-pos_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared/src:/app/shared/src
    networks:
      - pos-network


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./shared/src:/app/shared/src
    networks:
      - pos-network

volumes:
  mysql_data:

networks:
  pos-network:
    driver: bridge
